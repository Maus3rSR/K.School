# Reusable workflow
name: 🚀 Deploy Course
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: 🚀 Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 🛎️ Checkout files
        uses: actions/checkout@v4

      - name: 📥 Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
          run_install: false

      - name: 📥 Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: ⚙️ Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 💾 Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: 🏗️ Build courses
        run: |
          repo="${{ github.event.repository.name }}"

          for course_dir in courses/*; do
            [ -d "$course_dir" ] || continue
            [ -f "$course_dir/package.json" ] || continue

            folder_name="$(basename "$course_dir")"
            package_name="$(jq -r '.name' "$course_dir/package.json")"

            # Collect build:* scripts and their --out paths (key=outpath, one per line)
            multi_scripts="$(node -e "
              const p = require('./$course_dir/package.json');
              for (const [k, v] of Object.entries(p.scripts || {})) {
                if (!/^build:.+/.test(k)) continue;
                const m = v.match(/--out[= ](\S+)/);
                process.stdout.write(k + '=' + (m ? m[1] : '') + '\n');
              }
            ")"

            if [ -n "$multi_scripts" ]; then
              echo "📦 Multi-entrypoint build for $package_name:"
              while IFS='=' read -r script_key out_path; do
                [ -z "$script_key" ] && continue
                # Extract sub-path from out_path (e.g. dist/setup -> setup)
                subpath="${out_path##dist/}"
                base="/$repo/$folder_name/$subpath/"
                echo "  ▶ $script_key  --base $base  (out: $out_path)"
                (cd "$course_dir" && pnpm run "$script_key" -- --base "$base")
              done <<< "$multi_scripts"
            else
              echo "📦 Building $package_name (folder: $folder_name, base: /$repo/$folder_name/)..."
              pnpm turbo run build --filter="$package_name" --cache-dir=.turbo -- --base "/$repo/$folder_name/"
            fi
          done

      - name: 📦 Assemble Pages dist + index
        shell: bash
        run: |
          mkdir -p dist

          # course_entries: array of "name|type|subentries"
          # type = "single" or "multi"
          # subentries = space-separated list of sub-dir names (multi only)
          declare -A course_type
          declare -A course_subentries

          for course_dir in courses/*; do
            [ -d "$course_dir" ] || continue
            [ -d "$course_dir/dist" ] || continue

            course_name="$(basename "$course_dir")"
            echo "🔍 Found course dist: $course_dir"

            mkdir -p "dist/$course_name"

            # Detect multi-entrypoint: dist/ contains sub-dirs with their own index.html
            subentries=()
            for subdir in "$course_dir/dist"/*/; do
              [ -d "$subdir" ] || continue
              [ -f "${subdir}index.html" ] || continue
              subentries+=("$(basename "$subdir")")
            done

            if [ "${#subentries[@]}" -gt 0 ]; then
              echo "  ↳ Multi-entrypoint: ${subentries[*]}"
              course_type["$course_name"]="multi"
              course_subentries["$course_name"]="${subentries[*]}"
              for entry in "${subentries[@]}"; do
                echo "    📋 Copying $course_dir/dist/$entry/ → dist/$course_name/$entry/"
                mkdir -p "dist/$course_name/$entry"
                cp -r "$course_dir/dist/$entry/." "dist/$course_name/$entry/"
              done
            else
              echo "  ↳ Single-entrypoint → dist/$course_name/"
              course_type["$course_name"]="single"
              cp -r "$course_dir/dist/." "dist/$course_name/"
            fi
          done

          course_names=("${!course_type[@]}")

          if [ "${#course_names[@]}" -eq 0 ]; then
            echo "❌ No course build found in courses/*/dist"
            exit 1
          fi

          IFS=$'\n' sorted_courses=($(printf '%s\n' "${course_names[@]}" | sort))
          unset IFS

          echo ""
          echo "📄 Generating index.html with ${#sorted_courses[@]} course(s):"
          for c in "${sorted_courses[@]}"; do
            if [ "${course_type[$c]}" = "multi" ]; then
              echo "  • $c (multi: ${course_subentries[$c]})"
            else
              echo "  • $c (single)"
            fi
          done

          cat > dist/index.html <<'EOF'
          <!doctype html>
          <html lang="fr">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0" />
              <title>K.School Courses</title>
              <style>
                :root {
                  color-scheme: light;
                  --bg: #f6f8fb;
                  --text: #1f2937;
                  --card: #ffffff;
                  --border: #e5e7eb;
                  --accent: #0f766e;
                  --accent-hover: #115e59;
                }
                * { box-sizing: border-box; }
                body {
                  margin: 0;
                  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
                  color: var(--text);
                  background:
                    radial-gradient(circle at top right, #d1fae5 0%, transparent 35%),
                    radial-gradient(circle at top left, #e0e7ff 0%, transparent 30%),
                    var(--bg);
                }
                main {
                  max-width: 820px;
                  margin: 48px auto;
                  padding: 0 20px;
                }
                h1 {
                  margin: 0 0 8px;
                  font-size: clamp(2rem, 4vw, 2.8rem);
                }
                p {
                  margin: 0 0 24px;
                  line-height: 1.5;
                }
                ul {
                  list-style: none;
                  margin: 0;
                  padding: 0;
                  display: grid;
                  gap: 12px;
                }
                .card {
                  background: var(--card);
                  border: 1px solid var(--border);
                  border-radius: 12px;
                  padding: 16px;
                  transition: transform .15s ease, border-color .15s ease;
                }
                .card:hover {
                  transform: translateY(-2px);
                  border-color: var(--accent);
                }
                .card a {
                  display: block;
                  text-decoration: none;
                  color: inherit;
                }
                .label {
                  font-weight: 600;
                  margin-bottom: 4px;
                }
                .url {
                  color: var(--accent-hover);
                  font-size: .92rem;
                }
                .subentries {
                  margin-top: 10px;
                  padding-top: 10px;
                  border-top: 1px solid var(--border);
                  display: flex;
                  flex-wrap: wrap;
                  gap: 8px;
                }
                .subentries a {
                  display: inline-block;
                  text-decoration: none;
                  background: var(--bg);
                  border: 1px solid var(--border);
                  border-radius: 8px;
                  padding: 6px 12px;
                  font-size: .88rem;
                  color: var(--accent);
                  font-weight: 500;
                  transition: background .15s ease, border-color .15s ease;
                }
                .subentries a:hover {
                  background: #d1fae5;
                  border-color: var(--accent);
                }
              </style>
            </head>
            <body>
              <main>
                <h1>K.School Courses</h1>
                <p>Sélectionnez un cours pour ouvrir les slides publiées sur GitHub Pages.</p>
                <ul>
          EOF

          for course in "${sorted_courses[@]}"; do
            if [ "${course_type[$course]}" = "multi" ]; then
              # Card with sub-links, no top-level href
              printf '                  <li><div class="card"><div class="label">%s</div><div class="subentries">\n' "$course" >> dist/index.html
              for entry in ${course_subentries[$course]}; do
                printf '                    <a href="./%s/%s/">%s</a>\n' "$course" "$entry" "$entry" >> dist/index.html
              done
              printf '                  </div></div></li>\n' >> dist/index.html
            else
              printf '                  <li><div class="card"><a href="./%s/"><div class="label">%s</div><div class="url">./%s/</div></a></div></li>\n' "$course" "$course" "$course" >> dist/index.html
            fi
          done

          cat >> dist/index.html <<'EOF'
                </ul>
              </main>
            </body>
          </html>
          EOF

          touch dist/.nojekyll
          echo ""
          echo "✅ dist/ assembled. Contents:"
          find dist -maxdepth 2 -name "index.html" | sort | sed 's/^/  /'

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
