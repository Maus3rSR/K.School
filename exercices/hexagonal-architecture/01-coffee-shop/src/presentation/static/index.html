<!doctype html>
<html lang="en" data-theme="coffee">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>☕ Coffee Shop Deluxe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@4/dist/full.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-base-200 min-h-screen p-4 md:p-8">
    <div class="max-w-4xl mx-auto">
      <!-- Header -->
      <div class="text-center mb-8">
        <h1 class="text-5xl font-bold mb-2">☕ Coffee Shop Deluxe</h1>
        <p class="text-lg text-base-content/70">
          Hexagonal Architecture + CQS Live Coding
        </p>
      </div>

      <!-- Grid Layout -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-6">
        <!-- Stock Section -->
        <div class="card bg-base-100 shadow-xl">
          <div class="card-body">
            <h2 class="card-title text-2xl mb-4">📦 Stock</h2>
            <div id="stock" class="space-y-2">
              <div class="skeleton h-12"></div>
              <div class="skeleton h-12"></div>
              <div class="skeleton h-12"></div>
            </div>
          </div>
        </div>

        <!-- Recipes Section -->
        <div class="card bg-base-100 shadow-xl">
          <div class="card-body">
            <h2 class="card-title text-2xl mb-4">📋 Available Recipes</h2>
            <div id="recipes" class="space-y-2">
              <div class="skeleton h-12"></div>
              <div class="skeleton h-12"></div>
              <div class="skeleton h-12"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Order Section -->
      <div class="card bg-base-100 shadow-xl mb-6">
        <div class="card-body">
          <h2 class="card-title text-2xl mb-6">☕ New Order</h2>

          <div class="form-control gap-4">
            <div>
              <label class="label">
                <span class="label-text font-semibold">Select Recipe</span>
              </label>
              <select id="recipeSelect" class="select select-bordered w-full">
                <option disabled selected>Choose a recipe...</option>
              </select>
            </div>

            <div>
              <label class="label">
                <span class="label-text font-semibold"
                  >Amount Paid (cents)</span
                >
              </label>
              <input
                id="amountInput"
                type="number"
                placeholder="e.g., 300"
                class="input input-bordered w-full"
                min="0"
              />
            </div>

            <button onclick="prepareBeverage()" class="btn btn-primary btn-lg">
              ☕ Prepare Beverage
            </button>
          </div>

          <!-- Result -->
          <div id="orderResult" class="mt-6"></div>
        </div>
      </div>

      <!-- Admin Section -->
      <div class="card bg-base-100 shadow-xl mb-6">
        <div class="card-body">
          <h2 class="card-title text-2xl mb-6">🔧 Admin Panel</h2>

          <div class="form-control gap-4">
            <div>
              <label class="label">
                <span class="label-text font-semibold">Ingredient Name</span>
              </label>
              <input
                id="ingredientInput"
                type="text"
                placeholder="e.g., Coffee"
                class="input input-bordered w-full"
              />
            </div>

            <div>
              <label class="label">
                <span class="label-text font-semibold">Quantity to Add</span>
              </label>
              <input
                id="quantityInput"
                type="number"
                placeholder="e.g., 5"
                class="input input-bordered w-full"
                min="1"
              />
            </div>

            <button
              onclick="restockIngredient()"
              class="btn btn-secondary btn-lg"
            >
              📦 Restock Ingredient
            </button>
          </div>

          <!-- Restock Result -->
          <div id="restockResult" class="mt-6"></div>
        </div>
      </div>

      <!-- Sales History Section -->
      <div class="card bg-base-100 shadow-xl">
        <div class="card-body">
          <h2 class="card-title text-2xl mb-4">📊 Sales History</h2>
          <div id="salesHistory" class="overflow-x-auto">
            <table class="table w-full">
              <thead>
                <tr>
                  <th>Beverage</th>
                  <th>Price</th>
                  <th>Time</th>
                </tr>
              </thead>
              <tbody id="salesTableBody">
                <tr>
                  <td colspan="3" class="text-center text-base-content/50">
                    No sales yet
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast toast-top toast-end"></div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
